<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Stopwatch button at top -->
  <rect x="236" y="80" width="40" height="25" fill="none" stroke="#ffffff" stroke-width="10" rx="3"/>

  <!-- Main clock circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="18"/>

  <!-- Clock markings at 12, 3, 6, 9 positions -->
  <!-- 12 o'clock -->
  <line x1="256" y1="76" x2="256" y2="96" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- 3 o'clock -->
  <line x1="436" y1="256" x2="416" y2="256" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- 6 o'clock -->
  <line x1="256" y1="436" x2="256" y2="416" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- 9 o'clock -->
  <line x1="76" y1="256" x2="96" y2="256" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- Hour hand (short, thick) pointing to 12 -->
  <line x1="256" y1="256" x2="256" y2="184" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- Minute hand (long, thin) pointing to 12 -->
  <line x1="256" y1="256" x2="256" y2="139" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
</svg>
